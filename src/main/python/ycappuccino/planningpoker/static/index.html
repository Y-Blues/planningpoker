<!DOCTYPE html>
<!-- The planning poker's page: boot.js (ycappuccino client) starts Pyodide from ./ycappuccino.json; PokerPage draws into
     #app. Rooms are links (#<room id>): never indexed. -->
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Planning poker</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="poker.css" />
</head>
<body>
  <div id="app"></div>
  <div id="ycappuccino-loading">
    <div class="pp-boot-cards" aria-hidden="true"><span></span><span></span><span></span></div>
    <p id="ycappuccino-status" role="status"></p>
  </div>
  <script src="boot.js"></script>
</body>
</html>
