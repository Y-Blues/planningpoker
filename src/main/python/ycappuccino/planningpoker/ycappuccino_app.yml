# The planning poker as an app module (ycappuccino.core.composition): rooms reached by an unguessable link, anonymous
# nicknames bound to each browser's secret, votes live over WebSocket (WS-RPC calls, pubsub topic per room), its
# Pyodide page on /. No accounts. Its public surface: IPlanningPoker, and ICrud for reading its languages and texts only
# (the `language` and `translation` items of ui_content, seeded like the Y.Blues site's: TokenRights grants an anonymous
# caller read:language and read:translation, nothing else). Storage and port are the host's.
app: planningpoker
label: Planning poker
parts:
  web:
    bundles: [ycappuccino.endpoints_service, ycappuccino.hosts, ycappuccino.remote.servlet,   # remote's RPC doors only:
              ycappuccino.remote.dispatch, ycappuccino.remote.capabilities]                  # no REST API
  models:
    bundles: [ycappuccino.planningpoker.models]
  texts:                       # its languages and texts: ui_content's items and platform seed (French first, English),
    # its own texts seeded beside them (seed/translations.json, followed: a text edited since is kept), read by the page
    # over ICrud as the site reads its own (ycappuccino.ui.i18n); the anonymous caller's rights: those two reads only
    include: [ycappuccino.ui_content/profiles/platform_texts.yml]
    # the seed writes as the local service account `seed` (ServiceAccounts module mode: nothing written to an identity,
    # resolved by TokenRights here), holding the texts' writes only
    bundles: [ycappuccino.storage.seed, ycappuccino.endpoints_storage.crud, ycappuccino.permissions.token_rights,
              ycappuccino.permissions.service_accounts]
  services:
    bundles: [ycappuccino.planningpoker.rooms, ycappuccino.planningpoker.rate_limits,
              ycappuccino.planningpoker.room_events, ycappuccino.planningpoker.topic_access,
              ycappuccino.storage.polymorphic_cascade]   # a purged room's participants, tasks and votes
  realtime:
    bundles: [ycappuccino.pubsub, ycappuccino.remote.rpc_websocket_handler]
  front:
    fronts: [poker]
layers: [ycappuccino_remote_ws_rpc, ycappuccino_permissions_token_rights]
http:
  websocket: true
components:
  TokenRights:
    public_rights: ["read:language", "read:translation"]
  ServiceAccounts:
    mode: module
    module_roles: []
    module_accounts: [seed]
    accounts:
      seed: ["read:language", "write:language", "read:translation", "write:translation", "read:seedRecord", "write:seedRecord"]
  SeedLoader:
    sources:
      - id: planningpoker-texts
        directory: "package:ycappuccino.planningpoker/seed"
        files: {translations.json: translation}
        follow: true
  PlanningPoker:
    max_participants: ${poker.max_participants:30}
    max_tasks: ${poker.max_tasks:300}
    max_import: ${poker.max_import:200}
    expiry_days: ${poker.expiry_days:90}
    host_absent_seconds: ${poker.host_absent_seconds:120}
  RateLimits:                  # per visitor address: [max, window seconds]
    limits:
      create: [10, 3600]
      join_failure: [30, 600]  # unknown rooms asked
      action: [300, 60]
      import: [20, 3600]
  PolymorphicCascade:
    cascades:
      - {id: room-participants, item: poker_participant, by: room, of: poker_room}
      - {id: room-tasks, item: poker_task, by: room, of: poker_room}
      - {id: room-votes, item: poker_vote, by: room, of: poker_room}
  TopicModes:
    topics: ["planningpoker.*=websocket"]
  WebSocketGateway:
    allowed_origins: "${ws.allowed_origins:}"
  RpcWebSocketHandler:
    allowed_origins: "${ws.allowed_origins:}"
fronts:
  poker:                       # the page (Pyodide), built into build/poker
    path: /
    directory: build/poker
    priority: 0                # under the wheels mount (5): / would otherwise answer /wheels
    label: Planning poker
    client: ycappuccino.planningpoker/fronts/poker.json
assets:
  - copy: ycappuccino.planningpoker/static   # its index.html (French, noindex), stylesheet, robots.txt
