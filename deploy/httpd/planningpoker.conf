# Inside the ycappuccino.fr virtual host (https): /planningpoker/ is the planning poker's container, the prefix removed
# (mod_proxy, mod_proxy_wstunnel, mod_headers). mod_proxy appends the visitor's address to X-Forwarded-For.
RedirectMatch 301 ^/planningpoker$ /planningpoker/
ProxyPass        /planningpoker/rpc ws://127.0.0.1:8095/rpc
ProxyPass        /planningpoker/ws  ws://127.0.0.1:8095/ws
ProxyPass        /planningpoker/    http://127.0.0.1:8095/
ProxyPassReverse /planningpoker/    http://127.0.0.1:8095/
<Location /planningpoker/>
  Header set X-Robots-Tag "noindex, nofollow"
  Header set Referrer-Policy "no-referrer"
</Location>
