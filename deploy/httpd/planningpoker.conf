# Inside the ycappuccino.fr virtual host (https): /planningpoker/ is the planning poker's container, the prefix removed
# (mod_proxy, mod_proxy_wstunnel, mod_headers). Place it before any `ProxyPass /`. `planningpoker:8080` is the app
# on the proxy's docker network (deploy/docker-compose.yml); for a proxy on the host use 127.0.0.1:8095. mod_proxy appends the visitor's address to X-Forwarded-For.
RedirectMatch 301 ^/planningpoker$ /planningpoker/
ProxyPass        /planningpoker/rpc ws://planningpoker:8080/rpc
ProxyPass        /planningpoker/ws  ws://planningpoker:8080/ws
ProxyPass        /planningpoker/    http://planningpoker:8080/
ProxyPassReverse /planningpoker/    http://planningpoker:8080/
<Location /planningpoker/>
  Header set X-Robots-Tag "noindex, nofollow"
  Header set Referrer-Policy "no-referrer"
</Location>
